<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rackd · machine icons</title>
<style>
  :root{ --accent:#30D158; }
  *{box-sizing:border-box;}
  body{margin:0;background:#000;color:#f2f2f7;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;padding:32px;}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;}
  .sub{color:#8e8e93;font-size:14px;margin:0 0 28px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px;}
  .card{background:#1c1c1e;border:1px solid #2c2c2e;border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .big{width:108px;height:108px;border-radius:18px;background:#2c2c2e;display:flex;align-items:center;justify-content:center;color:#f2f2f7;}
  .row{display:flex;gap:14px;align-items:center;}
  .sm{width:38px;height:38px;border-radius:9px;background:#2c2c2e;display:flex;align-items:center;justify-content:center;color:#aeaeb2;}
  .accent{color:var(--accent);}
  .key{font-size:14px;font-weight:600;}
  .hint{color:#8e8e93;font-size:11px;}
  .controls{margin:0 0 24px;display:flex;gap:10px;}
  .controls button{background:#2c2c2e;color:#f2f2f7;border:0;border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;}
</style>
</head>
<body>
  <h1>machine icons</h1>
  <p class="sub">our own line illustrations · big (108px) + list-size (38px) · tap a swatch to recolour. edit <b>icons.js</b> and refresh to iterate.</p>
  <div class="controls">
    <button onclick="setColor('#f2f2f7')">white</button>
    <button onclick="setColor('#30D158')">accent</button>
    <button onclick="setColor('#aeaeb2')">muted</button>
  </div>
  <div class="grid" id="grid"></div>

  <script src="icons.js"></script>
  <script>
    function svg(inner,size){return `<svg width="${size}" height="${size}" viewBox="${ICON_VIEWBOX}" fill="none" stroke="currentColor" stroke-width="${window.ICON_STROKE||3}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;}
    function render(){
      document.getElementById('grid').innerHTML=Object.keys(ICONS).map(k=>`
        <div class="card">
          <div class="big">${svg(ICONS[k],84)}</div>
          <div class="row">
            <div class="sm">${svg(ICONS[k],30)}</div>
            <div class="key">${k}</div>
          </div>
        </div>`).join('');
    }
    function setColor(c){document.querySelectorAll('.big,.sm').forEach(e=>e.style.color=c);}
    render();
  </script>
</body>
</html>
